<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light" data-theme-mode="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="نظام متابعة إنجازات المكتب الإعلامي في المسجد">
  <title>متابعة المكتب الإعلامي</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/onboarding.css">
  <link rel="stylesheet" href="css/automation.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('mmo_theme') || 'auto';
        var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/utils.js"></script>

  <script src="js/charts.js"></script>
  <script src="js/io.js"></script>
  <script src="js/repo.js"></script>
  <script src="js/opencode.js"></script>
  <script src="js/settings-sections.js"></script>
  <script src="js/views.js"></script>
  <script src="js/automation-ui.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
