appId: com.mosque.mediaoffice
productName: المكتب الإعلامي
copyright: "© 2026 المكتب الإعلامي — جميع الحقوق محفوظة"

directories:
  buildResources: build
  output: release

files:
  - index.html
  - js/**/*
  - css/**/*
  - vendor/**/*
  - assets/**/*
  - electron/**/*
  - package.json

asar: true

win:
  target:
    - nsis
    - portable
  icon: assets/icon.png
  artifactName: "${productName}-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: المكتب الإعلامي
  language: 1025

publish: null

portable:
  artifactName: "${productName}-${version}-portable.${ext}"
