# ─────────────────────────────────────────────────────────────────────────────
# هوية التطبيق — لا تُغيَّر أبدًا
#
# `appId` و`productName` هما هوية الترقية نفسها:
#   • NSIS يتعرّف على النسخة المثبّتة سابقًا بهما، فيحدّثها في مكانها (in-place)
#     بدل تثبيت نسخة ثانية بجانبها.
#   • `productName` يحدّد اسم الملف التنفيذي واختصار سطح المكتب ومجلد التثبيت.
#   • مجلد بيانات المستخدم `%APPDATA%\mosque-media-office` يأتي من `name` في
#     package.json، ويبقى مستقلًا عن الإصدار وعن مجلد التثبيت.
# تغيير أي منهما يجعل النظام يرى تطبيقًا جديدًا: بيانات المستخدم تُفقد من منظور
# التطبيق، ويظهر اختصار/إدخال «التطبيقات» مكرر، وتفشل الترقية في المكان.
# أي تغيير في الهوية يحتاج ترحيلًا صريحًا ونسخة احتياطية مسبقة.
# ─────────────────────────────────────────────────────────────────────────────
appId: com.mosque.mediaoffice
productName: المكتب الإعلامي
copyright: "© 2026 المكتب الإعلامي — جميع الحقوق محفوظة"

directories:
  buildResources: build
  output: release

files:
  - index.html
  - js/**/*
  - css/**/*
  - vendor/**/*
  - assets/**/*
  - electron/**/*
  - package.json

asar: true
electronDist: node_modules/electron/dist
npmRebuild: false

win:
  target:
    - nsis
    - portable
  icon: assets/icon.png
  artifactName: "${productName}-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: المكتب الإعلامي
  language: 1025
  # بيانات المستخدم في %APPDATA%\mosque-media-office لا تُحذف عند إلغاء التثبيت.
  # (القيمة الافتراضية false أصلًا، ونكتبها صريحة حتى لا يتغيّر السلوك بالخطأ.)
  deleteAppDataOnUninstall: false
  # تشغيل التطبيق بعد نجاح التثبيت/الترقية.
  runAfterFinish: true
  # electron-builder 26.18 يدعم differentialPackage على هدف nsis
  # (app-builder-lib/scheme.json → NsisOptions، القيمة الافتراضية true).
  # نكتبها صريحة لأن الترقية في المكان تعتمد على تحديث الحزمة لا تثبيت نسخة ثانية.
  differentialPackage: true

publish: null

portable:
  artifactName: "${productName}-${version}-portable.${ext}"
